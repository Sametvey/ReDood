<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReDood</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:
        radial-gradient(circle at 50% 15%,#240000 0%,#0b0000 30%,#030303 75%);
    color:#cfcfcf;
    font-family:monospace;
    min-height:100vh;
    overflow-x:hidden;
}

/* Sahte kan lekeleri */
body::before,
body::after{
    content:"";
    position:fixed;
    pointer-events:none;
    z-index:0;
    opacity:.35;
}

body::before{
    width:180px;
    height:260px;
    left:3%;
    top:8%;
    background:
        radial-gradient(ellipse at 50% 10%,#6d0000 0 7%,transparent 8%),
        radial-gradient(ellipse at 30% 35%,#450000 0 12%,transparent 13%),
        radial-gradient(ellipse at 65% 65%,#650000 0 10%,transparent 11%);
    filter:blur(1px);
}

body::after{
    width:220px;
    height:300px;
    right:2%;
    bottom:5%;
    background:
        radial-gradient(ellipse at 45% 20%,#500000 0 9%,transparent 10%),
        radial-gradient(ellipse at 70% 55%,#700000 0 13%,transparent 14%),
        radial-gradient(ellipse at 30% 85%,#420000 0 8%,transparent 9%);
}

#app{
    position:relative;
    z-index:1;
    max-width:850px;
    margin:auto;
    padding:25px;
}

h1{
    color:#a00000;
    text-align:center;
    letter-spacing:6px;
    text-shadow:
        0 0 5px #500000,
        0 0 15px #250000;
}

h2{
    text-shadow:0 0 8px #300000;
}

button{
    width:100%;
    margin:7px 0;
    padding:15px;
    background:#080606;
    color:#bbb;
    border:1px solid #450000;
    font:inherit;
    cursor:pointer;
    box-shadow:0 0 8px #180000;
    transition:.2s;
}

button:hover{
    background:#180000;
    border-color:#900000;
    color:#eee;
    box-shadow:
        0 0 8px #600000,
        0 0 18px #250000;
}

#content,#login,#stats{
    display:none;
    margin-top:25px;
    padding:20px;
    background:rgba(5,0,0,.82);
    border:1px solid #3d0000;
    line-height:1.7;
    box-shadow:
        inset 0 0 25px #100000,
        0 0 12px #150000;
}

#content{
    white-space:pre-line;
}

input{
    padding:13px;
    width:100%;
    background:#080606;
    border:1px solid #500000;
    color:white;
    font:inherit;
    outline:none;
}

input:focus{
    border-color:#a00000;
    box-shadow:0 0 10px #300000;
}

.red{
    color:#a00000;
    text-shadow:0 0 7px #350000;
}

.stat{
    border-bottom:1px solid #300000;
    padding:10px 0;
}

#languageBar{
    position:fixed;
    top:10px;
    left:10px;
    z-index:9999;
    display:flex;
    gap:5px;
}

#languageBar button{
    width:auto;
    margin:0;
    padding:8px 12px;
    font-size:12px;
}

body.kurdish #content{
    display:none !important;
}
</style>
</head>

<body>

<div id="app">



<div id="languageBar">
<button onclick="setLanguage('tr')">🇹🇷 Türkçe</button>

</div>

<h1>ReDood</h1>

<div id="menu">

        <button onclick="redood5Final()">5</button>

</div>

    text-align:center;

<script>
let currentLanguage=localStorage.getItem("redood_language") || "tr";

function setLanguage(lang){
    currentLanguage=lang;
    localStorage.setItem("redood_language",lang);

    if(lang==="ku"){
        document.body.classList.add("kurdish");
        document.getElementById("content").style.display="none";
    }else{
        document.body.classList.remove("kurdish");
    }
}

if(currentLanguage==="ku"){
    document.body.classList.add("kurdish");
}


const ADMIN_PASSWORD = "ŞİFRE";

let click3 = 0;

function hideAll(){
    document.getElementById("content").style.display="none";
    document.getElementById("login").style.display="none";
    document.getElementById("stats").style.display="none";
}

function admin(){

    hideAll();

    if(localStorage.getItem("redood_admin")==="true"){
        showAdmin();
        return;
    }

    document.getElementById("login").style.display="block";
}

function checkPassword(){

    const p=document.getElementById("password").value;

    if(p===ADMIN_PASSWORD){

        localStorage.setItem("redood_admin","true");

        document.getElementById("login").style.display="none";

        showAdmin();

    }else{
        document.getElementById("wrong").innerText="Şifre yanlış.";
    }
}

function showAdmin(){

    const c=document.getElementById("content");

    c.innerText=
`Selam yabancı.

Buraya gelme sebebin şifreyi bilmen.
Seni tebrik ederim, beni buldun.

Ama yanında değilim.
En yakınındayım.

Bir telefonla unutma...
Gizem yeni başlıyor :)`;

    c.style.display="block";

    showStatsButton();

    document.getElementById("chapter2").style.display="block";
    document.getElementById("chapter3").style.display="block";
    document.getElementById("chapter4").style.display="block";

    loadChapter4();
    loadChapter5();

    showNotes();
}

function showStatsButton(){

    if(document.getElementById("statsButton")) return;

    const b=document.createElement("button");

    b.id="statsButton";
    b.innerText="📊 İSTATİSTİKLERİ GÖR";
    b.onclick=showStats;

    document.getElementById("menu").appendChild(b);
}

function countClick(n){

    let key="redood_click_"+n;

    let count=parseInt(localStorage.getItem(key)||"0");

    count++;

    localStorage.setItem(key,count);
}

function showStats(){

    hideAll();

    document.getElementById("stats").style.display="block";

    for(let i=1;i<=5;i++){

        let count=localStorage.getItem("redood_click_"+i)||"0";

        document.getElementById("s"+i).innerText=count;
    }
}

function resetStats(){

    for(let i=1;i<=5;i++){
        localStorage.removeItem("redood_click_"+i);
    }

    showStats();
}

function show(n){

    countClick(n);

`MERHABA.

BURAYA GELME.
BİR DAHA GELME.

BURADA KALMA.
UZAK DUR.`;

        }

    }

    const texts={

1:`ReDood

4:`Uğur kapımızda.

Dikkat et yabancı.

Bunu sana gönderdiğim için şanslısın.
Ama dikkat et, seni de kaybetmeyelim.

function showNotes(){

    box.style.padding="20px";

        <h2 class="red">🔐 ÖZEL NOTLARIM</h2>
        <textarea id="myNotes"
        style="width:100%;min-height:150px;background:#111;color:#ddd;border:1px solid #555;padding:12px;font:inherit"
        placeholder="Buraya kendi notunu yaz..."></textarea>
        <button onclick="saveNotes()">NOTU KAYDET</button>
        <p id="noteSaved"></p>
    `;

    document.getElementById("content").appendChild(box);

    document.getElementById("myNotes").value=
        localStorage.getItem("redood_private_notes")||"";
}

function saveNotes(){

    const text=document.getElementById("myNotes").value;

    localStorage.setItem("redood_private_notes",text);

    document.getElementById("noteSaved").innerText="Not kaydedildi.";
}

const REDOOD4_PASSWORD = "karanlık";

    if(!name || !adventure){

        document.getElementById("content").innerText=
        "ROBODİ: İkisini de doldurmalısın. Sonra devam ederiz.";

        return;

    localStorage.setItem("robodi_name",name);
    localStorage.setItem("robodi_adventure",adventure);

    document.getElementById("content").innerText=
`ROBODİ:
